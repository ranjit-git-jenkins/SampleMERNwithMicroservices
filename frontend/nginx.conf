server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/hello/ { proxy_pass http://hello-service:3001/; proxy_set_header Host $host; }
  location /api/profile/ { proxy_pass http://profile-service:3002/; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
