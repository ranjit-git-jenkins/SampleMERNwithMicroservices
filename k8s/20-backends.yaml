apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-service, namespace: mern-aks}
spec:
  replicas: 2
  selector: {matchLabels: {app: hello-service}}
  template:
    metadata: {labels: {app: hello-service}}
    spec:
      containers:
        - name: hello
          image: IMAGE_HELLO
          imagePullPolicy: Always
          ports: [{containerPort: 3001}]
          env: [{name: PORT, value: "3001"}]
          readinessProbe: {httpGet: {path: /health, port: 3001}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: 3001}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: hello-service, namespace: mern-aks}
spec:
  selector: {app: hello-service}
  ports: [{port: 3001, targetPort: 3001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: profile-service, namespace: mern-aks}
spec:
  replicas: 2
  selector: {matchLabels: {app: profile-service}}
  template:
    metadata: {labels: {app: profile-service}}
    spec:
      containers:
        - name: profile
          image: IMAGE_PROFILE
          imagePullPolicy: Always
          ports: [{containerPort: 3002}]
          env:
            - {name: PORT, value: "3002"}
            - name: MONGO_URL
              valueFrom:
                secretKeyRef: {name: mongo-auth, key: mongo-url}
          readinessProbe: {httpGet: {path: /health, port: 3002}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 3002}, initialDelaySeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata: {name: profile-service, namespace: mern-aks}
spec:
  selector: {app: profile-service}
  ports: [{port: 3002, targetPort: 3002}]
